# Every scheduled class is an ActiveJob (ApplicationJob), so each entry sets
# `active_job: true`. Without it sidekiq-cron falls back to a raw Sidekiq::Job
# payload whenever the enqueuing process can't resolve the class constant, and
# the worker then fails with `undefined method 'jid='` (we-promise/sure#1442).

import_market_data:
  cron: "0 22 * * 1-5" # 5:00 PM EST / 6:00 PM EDT (NY time) Monday through Friday
  class: "ImportMarketDataJob"
  active_job: true
  queue: "scheduled"
  description: "Imports market data daily at 5:00 PM EST (1 hour after market close)"
  args:
    mode: "full"
    clear_cache: false
  
clean_syncs:
  cron: "0 * * * *" # every hour
  class: "SyncCleanerJob"
  active_job: true
  queue: "scheduled"
  description: "Cleans up stale syncs and reaps imports and exports stuck by lost jobs"

run_security_health_checks:
  cron: "0 2 * * 1-5" # 2:00 AM EST / 3:00 AM EDT (NY time) Monday through Friday
  class: "SecurityHealthCheckJob"
  active_job: true
  queue: "scheduled"
  description: "Runs security health checks to detect issues with security data"

clean_data:
  cron: "0 3 * * *" # daily at 3:00 AM
  class: "DataCleanerJob"
  active_job: true
  queue: "scheduled"
  description: "Cleans up old data (e.g., expired merchant associations, expired archived exports)"

clean_debug_log_entries:
  cron: "30 3 * * *" # daily at 3:30 AM
  class: "DebugLogCleanupJob"
  active_job: true
  queue: "scheduled"
  description: "Deletes debug log entries older than 90 days"

clean_inactive_families:
  cron: "0 4 * * *" # daily at 4:00 AM
  class: "InactiveFamilyCleanerJob"
  active_job: true
  queue: "scheduled"
  description: "Archives and destroys families that expired their trial without subscribing (managed mode only)"

refresh_demo_family:
  cron: "0 5 * * *" # daily at 5:00 AM UTC
  class: "DemoFamilyRefreshJob"
  active_job: true
  queue: "scheduled"
  description: "Refreshes demo family data and emails super admins with daily usage summary"

generate_recurring_occurrences:
  cron: "30 5 * * *" # daily at 5:30 AM UTC, before insights so generators see fresh occurrences
  class: "GenerateRecurringOccurrencesJob"
  active_job: true
  queue: "scheduled"
  description: "Materializes the rolling window of recurring-transaction occurrences for every family"

generate_insights:
  cron: "0 6 * * *" # daily at 6:00 AM UTC, after the nightly cleanup jobs
  class: "GenerateInsightsJob"
  active_job: true
  queue: "scheduled"
  description: "Generates proactive financial insights for families with preview features enabled"

sweep_expired_goal_pledges:
  cron: "*/15 * * * *" # every 15 minutes
  class: "SweepExpiredGoalPledgesJob"
  active_job: true
  queue: "scheduled"
  description: "Marks goal pledges that passed their 7-day window as expired"

refresh_maintained_goal_targets:
  cron: "0 3 1 * *" # 3:00 AM on the 1st of each month
  class: "RefreshMaintainedGoalTargetsJob"
  active_job: true
  queue: "scheduled"
  description: "Recomputes the floor of reserves expressed in months of expenses"
